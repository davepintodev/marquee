# Copy to compose.yaml, fill in every <placeholder> and run:
#   docker compose up -d --build
services:
  marquee:
    build: .
    restart: unless-stopped
    # A user that may write to your media folder (find yours with `id`).
    user: "<uid>:<gid>"
    ports:
      - "8080:8080"
    volumes:
      # The library and the temp folder share this one mount, so an
      # import is an atomic rename.
      - <media-dir>:/media
      - <data-dir>:/data
      # Optional, for quality profiles (see the README): a JSON file, then
      # set MARQUEE_CONFIG below.
      # - <config-file>:/config/marquee.json:ro
    environment:
      MARQUEE_AIOSTREAMS_MANIFEST_URL: "<aiostreams-manifest-url>"
      MARQUEE_TMDB_KEY: "<tmdb-api-key>"
      MARQUEE_MOVIES_PATH: /media/movies
      MARQUEE_SERIES_PATH: /media/tv
      MARQUEE_TEMP_PATH: /media/.marquee-tmp
      MARQUEE_DATA_DIR: /data
      # Search and choose, but never download or write to the library.
      MARQUEE_DRY_RUN: "true"
      # Optional:
      # MARQUEE_JELLYFIN_URL: "<jellyfin-url>"
      # MARQUEE_JELLYFIN_KEY: "<jellyfin-api-key>"
      # Tell subfit when files are imported, replaced or deleted.
      # MARQUEE_SUBFIT_URL: "<subfit-url>"
      # MARQUEE_OMDB_KEY: "<omdb-api-key>"
      # MARQUEE_API_TOKEN: "<a-long-random-token>"
      # MARQUEE_CONFIG: /config/marquee.json
      #   Quality profiles live in this file: `profiles` (each with `qualities`,
      #   `reject`, `prefer`, `size_limits`), `default_movie_profile` and
      #   `default_series_profile`.
      # How often the library folders are read again; 0 turns it off.
      # MARQUEE_RESCAN_INTERVAL: "30m"
      # TorBox fetches releases that are not cached yet, and season packs.
      # MARQUEE_TORBOX_API_KEY: "<torbox-api-key>"
      # MARQUEE_TORBOX_MAX_ACTIVE: "2"
      # MARQUEE_TORBOX_STALL_TIMEOUT: "30m"
      # MARQUEE_TORBOX_MAX_LIFETIME: "4h"
      # MARQUEE_TORBOX_DELETE_ON_COMPLETE: "true"
