openapi: 3.1.0
info:
  title: marquee API
  version: 0.1.0
  description: >
    The HTTP API the web UI and the backend build against. This file is the
    single source of truth: the web client types are generated from it and a
    fixture-backed fake (`marquee --fake`) implements every operation.


    A title id is `<kind>-<tmdbId>`, for example `movie-438631`. An episode id
    is `sNNeNN`, for example `s04e02`. Ids are the same for a title found by
    search and for the same title in the library.
security:
  - {}
  - bearerAuth: []
tags:
  - name: titles
  - name: discovery
  - name: releases
  - name: activity
  - name: system

paths:
  /api/wall:
    get:
      tags: [discovery]
      operationId: getWall
      summary: The home wall, the library first and then TMDB trending.
      responses:
        "200":
          description: Tiles in display order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wall" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/search:
    get:
      tags: [discovery]
      operationId: searchTitles
      summary: Search TMDB for movies and series; library titles carry their badge.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Matching movies and series together.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/titles:
    get:
      tags: [titles]
      operationId: listTitles
      summary: Titles in the library.
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema:
                type: object
                required: [titles]
                properties:
                  titles:
                    type: array
                    items: { $ref: "#/components/schemas/TitleSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [titles]
      operationId: addTitle
      summary: Add a title and, by default, monitor it all. Adding a title already in the library changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddTitleRequest" }
      responses:
        "200":
          description: The title was already in the library.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Title" }
        "201":
          description: The title was added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Title" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/titles/{id}:
    parameters:
      - { $ref: "#/components/parameters/TitleId" }
    get:
      tags: [titles]
      operationId: getTitle
      summary: A title with its seasons, episodes and plain-language history.
      description: >-
        A title that is not in the library answers 404, so a series' seasons
        and episodes exist only once the series is added.
      responses:
        "200":
          description: The title.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Title" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [titles]
      operationId: updateTitle
      summary: Monitor or unmonitor a title, or set its preferred quality.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTitleRequest" }
      responses:
        "200":
          description: The updated title.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Title" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [titles]
      operationId: removeTitle
      summary: Remove a title from marquee. Files on disk are never deleted.
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/titles/{id}/search:
    parameters:
      - { $ref: "#/components/parameters/TitleId" }
    post:
      tags: [titles]
      operationId: searchTitleNow
      summary: Search now, skipping the backoff.
      responses:
        "200":
          description: The title, now searching.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Title" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/titles/{id}/episodes/{episodeId}:
    parameters:
      - { $ref: "#/components/parameters/TitleId" }
      - { $ref: "#/components/parameters/EpisodeId" }
    patch:
      tags: [titles]
      operationId: updateEpisode
      summary: Monitor or unmonitor one episode.
      description: >
        Monitoring an episode also monitors its title, so a title never
        searches for an episode while reporting itself unmonitored; its other
        episodes keep their state. Unmonitoring an episode, even the last
        monitored one, leaves the title monitored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monitored]
              additionalProperties: false
              properties:
                monitored: { type: boolean }
      responses:
        "200":
          description: The updated title.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Title" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/titles/{id}/seasons/{number}:
    parameters:
      - { $ref: "#/components/parameters/TitleId" }
      - name: number
        in: path
        required: true
        description: The season number; 0 is the Specials.
        schema: { type: integer, minimum: 0 }
    put:
      tags: [titles]
      operationId: updateSeason
      summary: Monitor or unmonitor a whole season.
      description: >
        Monitoring a season monitors every episode in it and, like
        updateEpisode, its title; the other seasons keep their state.
        Unmonitoring a season unmonitors its episodes and leaves the title
        monitored. An episode that is not in the season is not created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monitored]
              additionalProperties: false
              properties:
                monitored: { type: boolean }
      responses:
        "200":
          description: The updated title.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Title" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/titles/{id}/episodes/{episodeId}/search:
    parameters:
      - { $ref: "#/components/parameters/TitleId" }
      - { $ref: "#/components/parameters/EpisodeId" }
    post:
      tags: [titles]
      operationId: searchEpisodeNow
      summary: Search now for one episode, skipping the backoff.
      responses:
        "200":
          description: The title, with the episode now searching.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Title" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/titles/{id}/releases:
    parameters:
      - { $ref: "#/components/parameters/TitleId" }
    get:
      tags: [releases]
      operationId: listReleases
      summary: Interactive search, the ranked candidates and why others were dropped.
      description: Works for any title marquee knows, in the library or not; listing releases never adds a title.
      parameters:
        - name: episode
          in: query
          description: Episode id for a series; omit for a movie.
          required: false
          schema: { $ref: "#/components/schemas/EpisodeId" }
      responses:
        "200":
          description: Candidates in the order marquee would try them, and the drops.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Releases" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/NoSourceId" }
        "502": { $ref: "#/components/responses/SourceUnavailable" }
        "503": { $ref: "#/components/responses/SourceRateLimited" }
  /api/titles/{id}/releases/{releaseId}/grab:
    parameters:
      - { $ref: "#/components/parameters/TitleId" }
      - name: releaseId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      tags: [releases]
      operationId: grabRelease
      summary: Pick one release. It goes through the same download, check and import path and overrides the blocklist.
      description: >
        A title that is not in the library yet is added and monitored first.
        A release the chooser would drop as not cached, not a video or too
        small answers 409 with the reason; a blocklisted one can be grabbed.
        In dry-run nothing is downloaded, so every grab answers 409.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                episode: { $ref: "#/components/schemas/EpisodeId" }
      responses:
        "202":
          description: The download was queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Download" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The release was dropped (not cached, not a video or too small) and cannot be grabbed; the error says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/NoSourceId" }
        "502": { $ref: "#/components/responses/SourceUnavailable" }
        "503": { $ref: "#/components/responses/SourceRateLimited" }
  /api/downloads:
    get:
      tags: [activity]
      operationId: listDownloads
      summary: The download queue.
      responses:
        "200":
          description: Downloads that are not finished.
          content:
            application/json:
              schema:
                type: object
                required: [downloads]
                properties:
                  downloads:
                    type: array
                    items: { $ref: "#/components/schemas/Download" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/history:
    get:
      tags: [activity]
      operationId: listHistory
      summary: What happened, newest first, failures in plain language.
      description: >
        The feed merges finished downloads and the scheduler's notes. Its
        order is total and never changes for an entry that exists: newest
        `at` first (kept to the millisecond on the server, though `at` is
        shown to the second), then downloads before notes, then the newer
        row first. A page is cut by a keyset cursor, not by a count, so
        entries that arrive or disappear between two requests never repeat
        or skip an entry of a page already read: pass the `nextCursor` of
        a page as `cursor` to get the entries older than the page's last
        one. A cursor is opaque; do not build or read one, and expect a
        400 for one that was not given by the server. The server keeps the
        newest 5000 notes and the newest 5000 finished downloads, plus the
        latest finished download of every movie and episode so that a retry
        stays possible; older entries drop out of the feed.
      parameters:
        - name: titleId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TitleId" }
        - name: limit
          in: query
          required: false
          description: The most entries one page holds. Without it, a page holds 1000.
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page; without it, the newest entries.
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: History entries.
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/HistoryEntry" }
                  nextCursor:
                    type: string
                    description: The `cursor` of the next page; absent on the last page.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/history/{historyId}/retry:
    parameters:
      - name: historyId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post:
      tags: [activity]
      operationId: retryHistoryEntry
      summary: Push a failed item back into the queue.
      responses:
        "200":
          description: The title, now searching again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Title" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The entry is not a failure that can be retried.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/events:
    get:
      tags: [activity]
      operationId: streamEvents
      security:
        - {}
        - bearerAuth: []
        - cookieAuth: []
      summary: Live events as Server-Sent Events.
      description: >
        Each message has an `event:` name and a JSON `data:` line. `progress`
        carries a ProgressEvent for a running download; `title` carries a
        TitleEvent whenever a title's badge changes, including when it is
        added to or removed from the library. Lines starting with `:` are
        keep-alive comments to ignore. The stream never ends on its own;
        clients reconnect when it drops.
      responses:
        "200":
          description: An open event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/images/{kind}/{titleId}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [poster, backdrop] }
      - name: titleId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/TitleId" }
    get:
      tags: [discovery]
      operationId: getImage
      security:
        - {}
        - bearerAuth: []
        - cookieAuth: []
      summary: A poster (2:3) or backdrop (16:9). Fetched and cached by marquee, so the browser never contacts TMDB.
      responses:
        "200":
          description: The image.
          content:
            image/svg+xml:
              schema: { type: string }
            image/jpeg:
              schema: { type: string, contentEncoding: base64 }
            image/png:
              schema: { type: string, contentEncoding: base64 }
            image/webp:
              schema: { type: string, contentEncoding: base64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/titles/{id}/about:
    parameters:
      - { $ref: "#/components/parameters/TitleId" }
    get:
      tags: [discovery]
      operationId: getTitleAbout
      summary: Scores, cast and similar titles, to fill the details screen of any title.
      description: >-
        Answers for a title in the library and for one that is not, so the
        screen has something worth reading before a series is added. Scores
        are whatever sources marquee can reach: TMDB's, and IMDb's and Rotten
        Tomatoes' only when an OMDb key is configured (MARQUEE_OMDB_KEY) and
        OMDb answers. The answer is kept for a day; when TMDB cannot be
        reached, an older copy is served if there is one.
      responses:
        "200":
          description: What is known about the title.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleAbout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/people/{personId}/image:
    parameters:
      - name: personId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [discovery]
      operationId: getPersonImage
      security:
        - {}
        - bearerAuth: []
        - cookieAuth: []
      summary: A cast member's photo (2:3). Fetched and cached by marquee like a poster.
      description: Only linked from a cast member that has a photo.
      responses:
        "200":
          description: The photo.
          content:
            image/jpeg:
              schema: { type: string, contentEncoding: base64 }
            image/png:
              schema: { type: string, contentEncoding: base64 }
            image/webp:
              schema: { type: string, contentEncoding: base64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: What is misconfigured or broken. Read-only.
      responses:
        "200":
          description: Overall status, checks, library problems and library totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Optional API token (MARQUEE_API_TOKEN). With no token configured the
        API is open and clients send no Authorization header; with one, every
        operation answers 401 without `Authorization: Bearer <token>`, except
        that `getImage`, `getPersonImage` and `streamEvents` also accept the session cookie
        (`cookieAuth`).


        The token is handed over once, as the bearer header: the UI asks for
        it on each device (the unlock) and sends it with every request. Any
        request that carries a valid token and no valid session cookie gets a
        `marquee_session` cookie in its response, so no call of its own is
        needed. The UI opens the event stream only after a request has been
        answered, which is when the browser holds the cookie.
    cookieAuth:
      type: apiKey
      in: cookie
      name: marquee_session
      description: >
        Set by marquee in answer to a valid bearer token, for the
        operations a browser loads without being able to send a header: an
        `<img src>` and an `EventSource`. HttpOnly, `SameSite=Strict`, path
        `/api/`, one year, not `Secure` (marquee serves plain HTTP on a LAN).
        Its value is derived from the token, never the token itself, and a
        changed token ends every session. It is accepted only on `GET` of
        `getImage`, `getPersonImage` and `streamEvents`; every other operation, and any other
        method, still needs the bearer header, because `SameSite` ignores
        ports and another web app on the same host could otherwise send the
        cookie. A token in the URL was rejected: it lands in logs and in the
        browser history.
  parameters:
    TitleId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/TitleId" }
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EpisodeId" }
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: An API token is required and was missing or wrong.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Marquee failed on its own side, for example it cannot write its image cache. The error says nothing about TMDB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: TMDB, which marquee asks for metadata and images, did not answer or refused marquee's key. The error says which.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: TMDB is rate-limiting marquee; try again shortly.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SourceUnavailable:
      description: AIOStreams, the release source, did not answer or refused marquee's credentials. This is a source error, never an empty result; the error says which.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SourceRateLimited:
      description: AIOStreams is rate-limiting marquee; try again shortly. This is a source error, never an empty result.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoSourceId:
      description: TMDB lists no id that AIOStreams understands for this title (a series needs a TVDB or IMDb id), so it cannot be searched.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such title, episode, release or entry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: A plain-language reason. }
      examples:
        - { error: not found }
    TitleId:
      type: string
      pattern: "^(movie|series)-[0-9]+$"
      examples: [movie-438631]
    EpisodeId:
      type: string
      pattern: "^s[0-9]{2,3}e[0-9]{2,3}$"
      examples: [s04e02]
    Kind:
      type: string
      enum: [movie, series]
    BadgeState:
      type: string
      description: The closed set of states a tile can show.
      enum: [downloaded, searching, downloading, stalled, missing, partial_season]
    Badge:
      type: object
      required: [state, label]
      properties:
        state: { $ref: "#/components/schemas/BadgeState" }
        label:
          type: string
          description: Display text, such as "Downloading 43%" or "Season 4 · 3 missing".
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Present when state is downloading.
        season:
          type: integer
          minimum: 0
          description: Present when state is partial_season.
        missingCount:
          type: integer
          minimum: 1
          description: Present when state is partial_season.
      examples:
        - { state: partial_season, label: "Season 4 · 3 missing", season: 4, missingCount: 3 }
    TitleSummary:
      type: object
      required: [id, tmdbId, kind, title, year, overview, posterPath, backdropPath, inLibrary]
      properties:
        id: { $ref: "#/components/schemas/TitleId" }
        tmdbId: { type: integer }
        kind: { $ref: "#/components/schemas/Kind" }
        title: { type: string }
        year: { type: integer }
        overview: { type: string }
        posterPath: { type: string, description: Same-origin URL path of the poster. }
        backdropPath: { type: string, description: Same-origin URL path of the backdrop. }
        inLibrary: { type: boolean }
        monitored: { type: boolean, description: Present when inLibrary. }
        badge:
          $ref: "#/components/schemas/Badge"
          description: Present when inLibrary.
    Rating:
      type: object
      description: One score for a title, in the scale its source uses.
      required: [source, score, scale]
      properties:
        source: { type: string, enum: [tmdb, imdb, rotten_tomatoes] }
        score: { type: number, minimum: 0, description: "8.4 on a scale of 10, or 91 on a scale of 100." }
        scale: { type: integer, enum: [10, 100] }
        votes: { type: integer, minimum: 0, description: Present when the source says how many voted. }
    CastMember:
      type: object
      required: [personId, name, character]
      properties:
        personId: { type: integer, minimum: 1 }
        name: { type: string }
        character: { type: string, description: Empty when TMDB lists none. }
        profilePath: { type: string, description: Same-origin URL path of the photo. Absent when TMDB has none. }
    TitleAbout:
      type: object
      required: [ratings, genres, cast, similar]
      properties:
        ratings:
          type: array
          description: TMDB's score first, then any other source marquee reaches. Empty when there is none.
          items: { $ref: "#/components/schemas/Rating" }
        genres:
          type: array
          items: { type: string }
        runtimeMinutes: { type: integer, minimum: 1, description: An episode for a series. }
        status: { type: string, examples: [Ended] }
        language: { type: string, examples: [English] }
        cast:
          type: array
          description: Billing order, at most 20.
          items: { $ref: "#/components/schemas/CastMember" }
        similar:
          type: array
          description: At most 6 titles, each as it would show on the wall.
          items: { $ref: "#/components/schemas/TitleSummary" }
    WallItem:
      type: object
      required: [source, title]
      properties:
        source: { type: string, enum: [library, trending] }
        title: { $ref: "#/components/schemas/TitleSummary" }
    Wall:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WallItem" }
    SearchResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/TitleSummary" }
    AddTitleRequest:
      type: object
      required: [kind, tmdbId]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/Kind" }
        tmdbId: { type: integer }
        preferredQuality: { $ref: "#/components/schemas/Quality" }
        monitor: { $ref: "#/components/schemas/MonitorChoice" }
    MonitorChoice:
      type: string
      default: all
      enum: [all, future, first_season, latest_season, none]
      description: >
        What to monitor when a series is added, and so what is searched for.
        `all` monitors every episode; `future` the episodes not yet aired;
        `first_season` and `latest_season` the first and the highest regular
        season (Specials, season 0, are never chosen); `none` adds the series
        unmonitored, with no episode monitored, so nothing is searched until
        the owner monitors something. Ignored for a movie.
    UpdateTitleRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        monitored: { type: boolean }
        preferredQuality:
          description: Send null to clear the preference.
          anyOf:
            - { $ref: "#/components/schemas/Quality" }
            - { type: "null" }
    Quality:
      type: string
      description: A soft preference over AIOStreams' own order.
      enum: [2160p, 1080p, 720p]
    EpisodeState:
      type: string
      enum: [downloaded, searching, downloading, stalled, missing, unaired]
    Episode:
      type: object
      required: [id, number, name, airDate, monitored, state]
      properties:
        id: { $ref: "#/components/schemas/EpisodeId" }
        number: { type: integer, minimum: 1 }
        name: { type: string }
        airDate: { type: string, format: date }
        monitored: { type: boolean }
        state: { $ref: "#/components/schemas/EpisodeState" }
        percent: { type: integer, minimum: 0, maximum: 100, description: Present when state is downloading. }
        nextSearchAt: { $ref: "#/components/schemas/NextSearchAt" }
    NextSearchAt:
      description: When marquee searches next. Null unless the item is monitored and searching or missing.
      anyOf:
        - { type: string, format: date-time }
        - { type: "null" }
    Season:
      type: object
      required: [number, episodes]
      properties:
        number: { type: integer, minimum: 0 }
        badge:
          $ref: "#/components/schemas/Badge"
          description: Present when the season has episodes to show a state for.
        episodes:
          type: array
          items: { $ref: "#/components/schemas/Episode" }
    Title:
      description: A title with everything the detail view needs.
      allOf:
        - { $ref: "#/components/schemas/TitleSummary" }
        - type: object
          required: [seasons, historySummary]
          properties:
            seasons:
              type: array
              description: Empty for a movie.
              items: { $ref: "#/components/schemas/Season" }
            preferredQuality:
              description: Null when no preference is set.
              anyOf:
                - { $ref: "#/components/schemas/Quality" }
                - { type: "null" }
            nextSearchAt: { $ref: "#/components/schemas/NextSearchAt" }
            historySummary:
              type: string
              description: One plain sentence, such as "Tried 3 releases, 2 fake, 1 stalled, retrying in 6h."
            history:
              type: array
              items: { $ref: "#/components/schemas/HistoryEntry" }
    Release:
      type: object
      required: [id, name, quality, sizeBytes, source, cached]
      properties:
        id: { type: string }
        name: { type: string }
        quality: { type: string, examples: [Bluray-1080p] }
        sizeBytes: { type: integer, minimum: 0 }
        source: { type: string, description: The AIOStreams addon or tracker that listed it. }
        cached: { type: boolean }
    DropReason:
      type: string
      enum: [not_cached, not_video, too_small, wrong_episode, blocklisted]
    DroppedRelease:
      type: object
      required: [release, reason, message]
      properties:
        release: { $ref: "#/components/schemas/Release" }
        reason: { $ref: "#/components/schemas/DropReason" }
        message:
          type: string
          description: Plain language, such as "a .exe file, not a video".
    Releases:
      type: object
      required: [candidates, dropped]
      properties:
        candidates:
          type: array
          items: { $ref: "#/components/schemas/Release" }
        dropped:
          type: array
          items: { $ref: "#/components/schemas/DroppedRelease" }
    DownloadState:
      type: string
      enum: [queued, downloading, verifying, importing]
    Download:
      type: object
      required: [id, titleId, titleName, releaseName, state, percent, bytesDone, bytesTotal, stalled]
      properties:
        id: { type: string }
        titleId: { $ref: "#/components/schemas/TitleId" }
        titleName: { type: string }
        episode: { $ref: "#/components/schemas/EpisodeId" }
        releaseName: { type: string }
        state: { $ref: "#/components/schemas/DownloadState" }
        percent: { type: integer, minimum: 0, maximum: 100 }
        bytesDone: { type: integer, minimum: 0 }
        bytesTotal: { type: integer, minimum: 0 }
        stalled: { type: boolean, description: No bytes have arrived recently. }
    HistoryKind:
      type: string
      enum: [added, searched, would_grab, imported, failed]
    FailureReason:
      type: string
      enum: [stalled, not_video, wrong_episode, too_small, size_mismatch, source_down, local_error]
    HistoryEntry:
      type: object
      required: [id, at, kind, titleId, titleName, message, retryable]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        kind: { $ref: "#/components/schemas/HistoryKind" }
        titleId: { $ref: "#/components/schemas/TitleId" }
        titleName: { type: string }
        episode: { $ref: "#/components/schemas/EpisodeId" }
        message: { type: string, description: "What happened, in words." }
        reason: { $ref: "#/components/schemas/FailureReason" }
        retryable: { type: boolean, description: True for a failure that can be pushed back into the queue. }
    ProgressEvent:
      type: object
      description: Data of the `progress` event.
      required: [downloadId, titleId, state, percent, bytesDone, bytesTotal]
      properties:
        downloadId: { type: string }
        titleId: { $ref: "#/components/schemas/TitleId" }
        episode: { $ref: "#/components/schemas/EpisodeId" }
        state: { $ref: "#/components/schemas/DownloadState" }
        percent: { type: integer, minimum: 0, maximum: 100 }
        bytesDone: { type: integer, minimum: 0 }
        bytesTotal: { type: integer, minimum: 0 }
    TitleEvent:
      type: object
      description: Data of the `title` event.
      required: [titleId, badge]
      properties:
        titleId: { $ref: "#/components/schemas/TitleId" }
        badge:
          description: Null when the title left the library.
          anyOf:
            - { $ref: "#/components/schemas/Badge" }
            - { type: "null" }
    CheckStatus:
      type: string
      enum: [ok, warning, error]
    HealthCheck:
      type: object
      required: [id, name, status, message]
      properties:
        id:
          type: string
          enum: [fake_data, dry_run, aiostreams, tmdb, library_paths, temp_path, jellyfin]
        name: { type: string }
        status: { $ref: "#/components/schemas/CheckStatus" }
        message: { type: string }
    LibraryProblem:
      type: object
      required: [path, reason, message]
      properties:
        path: { type: string, description: Relative to the library root. }
        reason: { type: string, enum: [unmatched, ambiguous, unparsed_file] }
        message: { type: string }
    LibraryTotals:
      type: object
      description: How much the library holds, so a client need not read every title to say so.
      required: [movies, episodes]
      properties:
        movies: { type: integer, minimum: 0, description: Movies in the library. }
        episodes: { type: integer, minimum: 0, description: Episodes of every series in the library. }
    Health:
      type: object
      required: [status, dryRun, checks, libraryProblems, libraryTotals]
      properties:
        status: { $ref: "#/components/schemas/CheckStatus" }
        dryRun: { type: boolean }
        checks:
          type: array
          items: { $ref: "#/components/schemas/HealthCheck" }
        libraryProblems:
          type: array
          items: { $ref: "#/components/schemas/LibraryProblem" }
        libraryTotals: { $ref: "#/components/schemas/LibraryTotals" }
